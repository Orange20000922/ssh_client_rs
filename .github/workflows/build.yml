name: 跨平台构建

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  release:
    types: [created]

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 (Apple Silicon)
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: ssh_client_rs
            asset_name: ssh_client_rs-macos-arm64

          # macOS x86_64 (Intel) - 使用交叉编译
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: ssh_client_rs
            asset_name: ssh_client_rs-macos-x64

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ssh_client_rs.exe
            asset_name: ssh_client_rs-windows-x64.exe

          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ssh_client_rs
            asset_name: ssh_client_rs-linux-x64

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: 设置Rust缓存
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: 安装依赖 (macOS)
      if: startsWith(matrix.os, 'macos')
      run: |
        # vendored-openssl会自动编译OpenSSL，macOS已经有perl和make
        echo "Using vendored OpenSSL - no additional dependencies needed"

    - name: 安装依赖 (Linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        # vendored-openssl需要perl和make（通常已经预装）
        sudo apt-get update
        sudo apt-get install -y perl make

    - name: 安装依赖 (Windows)
      if: startsWith(matrix.os, 'windows')
      run: |
        # Windows需要Perl来编译vendored OpenSSL
        choco install strawberryperl -y

    - name: 构建
      run: cargo build --release --target ${{ matrix.target }}

    - name: 重命名二进制文件
      shell: bash
      run: |
        cd target/${{ matrix.target }}/release
        if [ -f "${{ matrix.artifact_name }}" ]; then
          cp "${{ matrix.artifact_name }}" "../../../${{ matrix.asset_name }}"
        fi

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ matrix.asset_name }}

    - name: 发布到Release（如果是release事件）
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.asset_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
